<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Liga - Dashboard Estadísticas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>La Liga 🇪🇸</h1>
        <p>Dashboard de Resultados y Estadísticas</p>
    </header>

    <main class="container">
        <section class="section">
            <h2>Últimos Resultados</h2>
            <div id="matches-grid" class="matches-grid">
                <div class="loader">Buscando últimos partidos...</div>
            </div>
        </section>

        <section class="section">
            <h2>Top Jugadores</h2>
            <div class="scorers-container" id="scorers-list">
                <div class="loader">Cargando estadísticas detalladas...</div>
            </div>
        </section>
    </main>

    <script src="app.js?v=7"></script>
</body>
</html>
